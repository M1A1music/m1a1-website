<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Listen to CONSTANT by M1A1">
    <title>M1A1 - CONSTANT</title>
    <link rel="icon" type="image/png" href="../assets/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --accent-color: #00ff41; /* Toxic Green */
            --text-color: #e0e0e0;
            --glass-bg: rgba(15, 15, 15, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* Blurred background of the cover art */
        .bg-blur {
            position: absolute;
            top: -10%;
            left: -10%;
            width: 120%;
            height: 120%;
            background-image: url('../assets/m1a1.png');
            background-size: cover;
            background-position: center;
            filter: blur(40px) brightness(0.3);
            z-index: -1;
        }

        .smart-link-container {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 2.5rem 2rem;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
            animation: fadeIn 0.8s ease-out;
        }

        .cover-art {
            width: 100%;
            max-width: 280px;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--glass-border);
        }

        h1 {
            font-family: 'Share Tech Mono', monospace;
            font-size: 2rem;
            color: #fff;
            margin-bottom: 0.25rem;
            letter-spacing: 2px;
        }

        h2 {
            font-size: 1rem;
            font-weight: 400;
            color: #aaa;
            margin-bottom: 2rem;
            letter-spacing: 1px;
        }

        .links-wrapper {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .platform-btn {
            display: block;
            width: 100%;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            text-decoration: none;
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.1rem;
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            transition: all 0.3s ease;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }

        .platform-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--accent-color);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 255, 65, 0.1);
            color: var(--accent-color);
        }

        /* Glitch hover effect */
        .platform-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 65, 0.1), transparent);
            transition: all 0.5s ease;
        }

        .platform-btn:hover::before {
            left: 100%;
        }

        .footer-logo {
            margin-top: 2rem;
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.9rem;
            color: #666;
            text-decoration: none;
            display: inline-block;
            transition: color 0.3s ease;
        }

        .footer-logo:hover {
            color: #fff;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="bg-blur"></div>

    <div class="smart-link-container">
        <img src="../assets/m1a1.png" alt="Constant Cover Art" class="cover-art">
        <h1>CONSTANT</h1>
        <h2>M1A1</h2>

        <div class="links-wrapper">
            <a href="https://open.spotify.com/track/6le8t4RjlEFznX8BQQALjO?si=47154120da054976" target="_blank" rel="noopener noreferrer" class="platform-btn">SPOTIFY</a>
            <a href="https://music.apple.com/us/album/constant-feat-jack-prime-single/1891307367" target="_blank" rel="noopener noreferrer" class="platform-btn">APPLE MUSIC</a>
            <a href="https://music.youtube.com/watch?v=Vbwk7pi4H2w&si=2L1hMz0LX4IwCYRM" target="_blank" rel="noopener noreferrer" class="platform-btn">YOUTUBE</a>
            <a href="https://soundcloud.com/m1a1music" target="_blank" rel="noopener noreferrer" class="platform-btn">SOUNDCLOUD</a>
            <a href="https://m1a1music.bandcamp.com/" target="_blank" rel="noopener noreferrer" class="platform-btn">BANDCAMP</a>
        </div>

        <a href="../index.html" class="footer-logo">M1A1.MUSIC</a>
    </div>
</body>
</html>
